services:

    postgres:
        hostname: zabbix-postgres
        container_name: zabbix_postgres
        user: "${DOCKER_POSTGRES_UID}:${DOCKER_POSTGRES_GID}"
        build:
            context: .
            dockerfile: ./docker/postgres/Dockerfile
#        ports:
#            - "5432:5432"
        env_file:
            - .env
        environment:
            PGDATA: /pgdata
        volumes:
            - ./volumes/postgres/pgdata:/pgdata
        restart: always
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            zabbix_network:
                ipv4_address: 172.20.0.2

    server:
        hostname: zabbix-server
        container_name: zabbix_server
        user: zabbix
        build:
            context: .
            dockerfile: ./docker/zabbix-server/Dockerfile
#        ports:
#            - "10051:10051"
        env_file:
            - .env
        restart: always
        depends_on:
            - postgres
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            zabbix_network:
                ipv4_address: 172.20.0.3

    agent:
        hostname: zabbix-agent
        container_name: zabbix_agent
        user: zabbix
        build:
            context: .
            dockerfile: ./docker/zabbix-agent/Dockerfile
        env_file:
            - .env
#        pid: host
#        volumes:
#            - /:/host/rootfs:ro
#            - /proc:/host/proc:ro
#            - /sys:/host/sys:ro
#        ports:
#            - "10050:10050"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        networks:
            zabbix_network:
                ipv4_address: 172.20.0.4

    web:
        hostname: zabbix-web
        container_name: zabbix_web
        user: zabbix
        build:
            context: .
            dockerfile: ./docker/zabbix-web/Dockerfile
        ports:
#            - "8080:8080"
            - "8443:8443"
        env_file:
            - .env
        depends_on:
            - agent
            - server
            - postgres
        restart: always
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            zabbix_network:
                ipv4_address: 172.20.0.5
            main_network:

networks:
    zabbix_network:
        driver: bridge
        internal: true
        ipam:
            config:
                -   subnet: 172.20.0.0/24
    main_network: