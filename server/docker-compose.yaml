services:

    postgres:
        hostname: zabbix-postgres
        container_name: zabbix_postgres
        user: "${DOCKER_POSTGRES_UID}:${DOCKER_POSTGRES_GID}"
        build:
            context: .
            dockerfile: ./docker/postgres/Dockerfile
        env_file:
            - .env
        environment:
            PGDATA: /pgdata
        volumes:
            - ./volumes/postgres/pgdata:/pgdata
        restart: always
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - zabbix-inet

    server:
        hostname: zabbix-server
        container_name: zabbix_server
        user: zabbix
        build:
            context: .
            dockerfile: ./docker/zabbix-server/Dockerfile
        ports:
            - "10051:10051"
        env_file:
            - .env
        restart: always
        depends_on:
            - postgres
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - zabbix-net
            - zabbix-inet

    web:
        hostname: zabbix-web
        container_name: zabbix_web
        user: zabbix
        build:
            context: .
            dockerfile: ./docker/zabbix-web/Dockerfile
        ports:
            - "8443:8443"
        env_file:
            - .env
        depends_on:
            - server
            - postgres
        restart: always
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - zabbix-net
            - zabbix-inet

networks:
    zabbix-inet:
        driver: bridge
        internal: true
    zabbix-net:
        external: true